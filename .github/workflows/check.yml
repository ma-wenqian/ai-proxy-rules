name: check

on:
  push:
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated files match rules/*.list
        run: bash scripts/build.sh --check
      - name: Clash files are valid YAML
        run: |
          for f in Clash/*.yaml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
